services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: aptos_translate
    ports:
      - "5432:5432"
    volumes:
      - aptos_pg_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - aptos_redis_data:/data

  # S3-compatible API for local presigned uploads (create bucket `aptos-translate-uploads` in console :9001)
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    volumes:
      - aptos_minio:/data
    profiles: ["full"]

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/aptos_translate
      REDIS_URL: redis://redis:6379
      S3_REGION: us-east-1
      S3_BUCKET: aptos-translate-uploads
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY_ID: minio
      S3_SECRET_ACCESS_KEY: minio12345
      S3_FORCE_PATH_STYLE: "true"
    depends_on:
      - postgres
      - redis
      - minio
    profiles: ["full"]

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    ports:
      - "3000:3000"
    environment:
      # Browser (host): published API port on the machine.
      NEXT_PUBLIC_API_URL: http://localhost:3001
      # Next `/api/upstream/*` runs in this container — use the compose service name, not localhost/127.0.0.1.
      API_PROXY_TARGET: http://api:3001
    depends_on:
      - api
    profiles: ["full"]

volumes:
  aptos_pg_data:
  aptos_redis_data:
  aptos_minio:
